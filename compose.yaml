# Persönlicher Telegram-KI-Assistent
# FORMAT_VERSION = 1.1
#
#   Starten/aktualisieren:  docker compose pull && docker compose up -d
#   Logs ansehen:           docker compose logs -f
#   Stoppen:                docker compose down
#
# Das Image wird von GitHub Actions gebaut (ghcr.io); auf dem Server genügen diese Datei und die Env-Dateien.
#
# Alle Einstellungen stehen in der Env-Datei (Vorlage: .env.example), nicht in dieser Datei.
# Standard ist die Datei .env im selben Ordner.
#
# Mehrere Bots (z. B. mit verschiedenen Persönlichkeiten): je Bot eine eigene Env-Datei, z. B. .env.hamid mit
#   COMPOSE_PROJECT_NAME=hamid-afzal-assistant   (Projekt-, Container- und Volume-Name)
#   ENV_FILE=.env.hamid                          (diese Datei selbst, siehe .env.example)
#   TELEGRAM_BOT_TOKEN=...                       (jeder Bot braucht einen eigenen Token)
#   PERSONALITY_FILE=custom_personalities/hamid.md
# und beim Aufruf angeben:
#   docker compose --env-file .env.hamid pull
#   docker compose --env-file .env.hamid up -d
#   docker compose --env-file .env.hamid logs -f
name: ${COMPOSE_PROJECT_NAME:-telegram-assistant}

services:
  bot:
    image: ${BOT_IMAGE:-ghcr.io/aliqu12/telbot:latest}
    container_name: ${COMPOSE_PROJECT_NAME:-telegram-assistant}
    restart: unless-stopped
    # Pflichtwerte und Grenzen prüft der Bot beim Start und meldet Fehler gesammelt im Log.
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      # Im Container fest (hat Vorrang vor der Env-Datei): liegt im persistenten Volume.
      DATABASE_PATH: /data/assistant.db
    volumes:
      - assistant-data:/data
    # Keine Ports: Long Polling, IMAP/SMTP und Todoist (HTTPS) bauen nur ausgehende Verbindungen auf.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 256m
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  assistant-data:
